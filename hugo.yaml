baseURL: https://garden.shubhamlad.in/
locale: en-us
title: AIML Garden

module:
  imports:
    - path: github.com/imfing/hextra

enableRobotsTXT: true
enableGitInfo: false   # set to true once the repo has commits, to show "Last updated" dates
enableEmoji: true

# Notes live under content/notes and use the docs layout (sidebar + TOC)
cascade:
  - target:
      path: /notes/**
    type: docs
  - target:
      path: /notes
    type: docs

markup:
  goldmark:
    renderer:
      unsafe: true   # allow raw HTML inside notes
    extensions:
      # $...$ and $$...$$ math, rendered server-side with KaTeX (no JS needed)
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

menu:
  main:
    - name: Notes
      pageRef: /notes
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: https://github.com/shulapy
      params:
        icon: github
    - name: Theme
      weight: 4
      params:
        type: theme-toggle
        label: false

params:
  description: Lecture notes on mathematics, machine learning and deep learning, written while taking the AML course.

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 28
      height: 28
    width: wide

  page:
    width: wide
    displayPagination: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: wide

  theme:
    default: system
    displayToggle: true

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  highlight:
    copy:
      enable: true
      display: hover

  math:
    engine: katex

  toc:
    displayTags: true

  editURL:
    enable: false
